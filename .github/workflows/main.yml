name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          echo "Repository contents:"
          ls -la

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf _project
          mkdir -p _project

          unzip -q "$ZIP_FILE" -d _project

          echo "Searching for Flutter project..."
          find _project -type f -name "pubspec.yaml" -print

      - name: Locate Flutter project
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/_project" \
            -type f \
            -name "pubspec.yaml" \
            -not -path "*/.dart_tool/*" \
            -print -quit | xargs dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml not found."
            exit 1
          fi

          echo "Flutter project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check project structure
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo "Checking files..."

          test -f pubspec.yaml
          test -d android
          test -d lib

          echo "Flutter project structure OK."

      - name: Flutter version
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter --version

      - name: Get dependencies
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --debug

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "APK files:"
          find "$PROJECT_DIR/build/app/outputs/flutter-apk" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HOPE-debug-apk
          path: "_project/**/build/app/outputs/flutter-apk/*.apk"
          if-no-files-found: error
